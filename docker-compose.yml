version: '3.9'

services:
  db:
    image: postgres:15
    container_name: pulsenotify_db
    environment:
      POSTGRES_DB: pulsenotify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: pulsenotify_redis
    ports:
      - "6379:6379"